# Local development infrastructure (mirrors the ARKO setup).
# Target: Neon + Better Auth + Redis + private S3 + Resend; see docs/01-architecture.md.
name: freshphonesph

services:
  redis:
    image: redis:8.2-alpine
    container_name: fresh-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction", "--requirepass", "fresh-local-redis"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "fresh-local-redis", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:16-alpine
    container_name: fresh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fresh
      POSTGRES_PASSWORD: fresh
      POSTGRES_DB: fresh
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fresh"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: fresh-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/fresh-attachments;
      exit 0;
      "

  mailhog:
    image: mailhog/mailhog:latest
    container_name: fresh-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI

volumes:
  redisdata:
  pgdata:
  miniodata:
